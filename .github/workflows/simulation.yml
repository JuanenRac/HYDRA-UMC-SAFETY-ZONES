# Runs the real code of the service against a simulated plant (seeded data and stand-in services, with failures injected). See docs/SIMULATION.md.
# =============================================================================
name: Simulation bench

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation:
    name: Run the simulated scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the project
        run: python -m pip install -e ".[dev]" coverage
      - name: Run the scenarios of the simulation bench
        run: python -m pytest -q tests/test_simulation_bench.py
