<title id="t">HYDRA-UMC-SAFETY-ZONES architecture</title>
<desc id="d">HYDRA-UMC-SAFETY-ZONES loads zones, detections and observer status from JSON, refuses non-finite numbers, checks calibration and observer health first, then judges breaches and requests an emergency stop for Danger.</desc>
